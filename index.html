<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>מערכת משמרות</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyBfxiFf8zcSmT7TlvHcHc4_NZoPxN_jz0w",
      authDomain: "nutrition-plan-5ce1f.firebaseapp.com",
      databaseURL: "https://nutrition-plan-5ce1f-default-rtdb.firebaseio.com",
      projectId: "nutrition-plan-5ce1f",
      storageBucket: "nutrition-plan-5ce1f.firebasestorage.app",
      messagingSenderId: "1019976182145",
      appId: "1:1019976182145:web:d2dc3e1b7763604d68a080"
    });
    window.__authReady = new Promise(resolve => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      firebase.auth().onAuthStateChanged(user => { if (user) finish(); });
      firebase.auth().signInAnonymously().catch(err => { console.error("Anonymous auth failed:", err); finish(); });
      setTimeout(finish, 8000);
    });
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b1220; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    input, button { -webkit-appearance: none; -webkit-tap-highlight-color: transparent; font-family: inherit; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.4); border-radius: 2px; }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); } 50% { box-shadow: 0 0 0 18px rgba(248,113,113,0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const USER = "matan";
    const _db = firebase.database();

    // ─── helpers ────────────────────────────────────────────────────────────────
    function pad2(n) { return String(n).padStart(2, "0"); }
    function fmtHMS(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
    }
    function fmtHours(ms) {
      const totalMin = Math.round(ms / 60000);
      const h = Math.floor(totalMin / 60), m = totalMin % 60;
      return `${h} שעות ${m > 0 ? `ו-${m} דק'` : ""}`.trim();
    }
    function fmtTime(ts) {
      const d = new Date(ts);
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function fmtDate(ts) {
      const d = new Date(ts);
      return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
    }
    const MONTH_NAMES = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

    // ─── PIN pad (shared look) ──────────────────────────────────────────────────
    function PinPad({ title, subtitle, correctPin, onSuccess, onBack, accent }) {
      const [pin, setPin] = useState("");
      const [error, setError] = useState(false);
      const ref = useRef(null);
      useEffect(() => { ref.current?.focus(); }, []);

      const check = p => {
        if (correctPin === null) return;
        if (p === correctPin) onSuccess();
        else if (p.length === 4) { setError(true); setTimeout(() => { setError(false); setPin(""); }, 800); }
      };
      const press = d => { const next = (pin + d).slice(0, 4); setPin(next); if (next.length === 4 && correctPin !== null) check(next); };
      const handleKey = e => {
        if (e.key >= "0" && e.key <= "9") press(e.key);
        else if (e.key === "Backspace") setPin(p => p.slice(0, -1));
        else if (e.key === "Escape" && onBack) onBack();
      };

      return (
        <div onKeyDown={handleKey} tabIndex={0} ref={ref} style={{ minHeight: "100vh", background: "linear-gradient(160deg,#0b1220 0%,#111e3a 60%,#0b1220 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 26, fontFamily: "'Segoe UI',Tahoma,sans-serif", outline: "none", padding: 20 }}>
          <div style={{ fontSize: 40 }}>🕐</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: "#e2e8f0" }}>{title}</div>
          {subtitle && <div style={{ fontSize: 13, color: "#64748b", marginTop: -18 }}>{subtitle}</div>}
          <div style={{ display: "flex", gap: 12 }}>
            {[0,1,2,3].map(i => (
              <div key={i} style={{ width: 16, height: 16, borderRadius: "50%", background: pin.length > i ? (error ? "#f87171" : accent) : "#1e293b", border: `2px solid ${error ? "#f87171" : "#334155"}`, transition: "all 0.15s" }} />
            ))}
          </div>
          {error && <div style={{ color: "#f87171", fontSize: 13, marginTop: -14 }}>קוד שגוי</div>}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 70px)", gap: 10, direction: "ltr" }}>
            {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d, i) => (
              <button key={i} onClick={() => { if (d === "⌫") setPin(p => p.slice(0,-1)); else if (d !== "") press(String(d)); }}
                style={{ height: 70, borderRadius: 14, border: "1px solid #1e293b", background: d === "" ? "transparent" : "#111a2e", color: d === "⌫" ? "#f87171" : "#cbd5e1", fontSize: d === "⌫" ? 20 : 24, fontWeight: 600, cursor: d === "" ? "default" : "pointer" }}>
                {d}
              </button>
            ))}
          </div>
          {onBack && <button onClick={onBack} style={{ background: "transparent", border: "none", color: "#334155", fontSize: 13, cursor: "pointer" }}>← חזור</button>}
        </div>
      );
    }

    // ─── Manual shift add/edit modal ────────────────────────────────────────────
    function ShiftModal({ initial, onSave, onCancel }) {
      const toDateStr = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
      const toTimeStr = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const now = Date.now();
      const [date, setDate] = useState(initial ? toDateStr(initial.start) : toDateStr(now));
      const [start, setStart] = useState(initial ? toTimeStr(initial.start) : "09:00");
      const [end, setEnd] = useState(initial ? toTimeStr(initial.end) : "17:00");
      const [err, setErr] = useState("");

      const save = () => {
        const [y, mo, da] = date.split("-").map(Number);
        const [sh, sm] = start.split(":").map(Number);
        const [eh, em] = end.split(":").map(Number);
        const startTs = new Date(y, mo - 1, da, sh, sm).getTime();
        let endTs = new Date(y, mo - 1, da, eh, em).getTime();
        if (endTs <= startTs) endTs += 24 * 3600 * 1000; // overnight shift
        if (endTs - startTs > 20 * 3600 * 1000) { setErr("משמרת ארוכה מ-20 שעות? בדוק את השעות"); return; }
        onSave({ start: startTs, end: endTs, duration: endTs - startTs });
      };

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 }}>
          <div style={{ background: "#111a2e", borderRadius: 18, padding: 22, width: "100%", maxWidth: 360, border: "1px solid #1e293b" }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#e2e8f0", marginBottom: 16 }}>{initial ? "✏️ עריכת משמרת" : "➕ הוספת משמרת ידנית"}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <label style={{ fontSize: 12, color: "#64748b" }}>תאריך
                <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ display: "block", width: "100%", marginTop: 4, padding: 10, borderRadius: 10, border: "1px solid #334155", background: "#0b1220", color: "#e2e8f0" }} />
              </label>
              <div style={{ display: "flex", gap: 10 }}>
                <label style={{ fontSize: 12, color: "#64748b", flex: 1 }}>התחלה
                  <input type="time" value={start} onChange={e => setStart(e.target.value)} style={{ display: "block", width: "100%", marginTop: 4, padding: 10, borderRadius: 10, border: "1px solid #334155", background: "#0b1220", color: "#e2e8f0", direction: "ltr" }} />
                </label>
                <label style={{ fontSize: 12, color: "#64748b", flex: 1 }}>סיום
                  <input type="time" value={end} onChange={e => setEnd(e.target.value)} style={{ display: "block", width: "100%", marginTop: 4, padding: 10, borderRadius: 10, border: "1px solid #334155", background: "#0b1220", color: "#e2e8f0", direction: "ltr" }} />
                </label>
              </div>
              {err && <div style={{ color: "#f87171", fontSize: 12 }}>{err}</div>}
              <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                <button onClick={onCancel} style={{ flex: 1, padding: 12, borderRadius: 10, border: "1px solid #334155", background: "transparent", color: "#94a3b8", fontWeight: 600, cursor: "pointer" }}>ביטול</button>
                <button onClick={save} style={{ flex: 1, padding: 12, borderRadius: 10, border: "none", background: "#3b82f6", color: "#fff", fontWeight: 600, cursor: "pointer" }}>שמור</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Admin panel ─────────────────────────────────────────────────────────────
    function AdminPanel({ hourlyRate, onClose }) {
      const [rate, setRate] = useState(hourlyRate || 0);
      const [userPin, setUserPin] = useState("");
      const [adminPinVal, setAdminPinVal] = useState("");
      const [saved, setSaved] = useState("");

      const saveRate = () => {
        _db.ref(`shifts/${USER}/hourlyRate`).set(Number(rate) || 0);
        setSaved("תעריף עודכן ✓"); setTimeout(() => setSaved(""), 1500);
      };
      const saveUserPin = () => {
        if (userPin.length !== 4) return;
        _db.ref(`shifts/${USER}/pin`).set(userPin);
        setUserPin(""); setSaved("PIN עודכן ✓"); setTimeout(() => setSaved(""), 1500);
      };
      const saveAdminPin = () => {
        if (adminPinVal.length !== 4) return;
        _db.ref("shifts/_admin/adminPin").set(adminPinVal);
        setAdminPinVal(""); setSaved("PIN מנהל עודכן ✓"); setTimeout(() => setSaved(""), 1500);
      };

      return (
        <div style={{ position: "fixed", inset: 0, background: "#0b1220", zIndex: 40, overflowY: "auto", padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
            <div style={{ fontSize: 18, fontWeight: 700, color: "#e2e8f0" }}>🔧 הגדרות</div>
            <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#64748b", fontSize: 20, cursor: "pointer" }}>✕</button>
          </div>

          <div style={{ background: "#111a2e", borderRadius: 16, padding: 18, marginBottom: 14, border: "1px solid #1e293b" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 12 }}>💰 תעריף לשעה (₪)</div>
            <div style={{ display: "flex", gap: 10 }}>
              <input type="number" value={rate} onChange={e => setRate(e.target.value)} style={{ flex: 1, padding: 10, borderRadius: 10, border: "1px solid #334155", background: "#0b1220", color: "#e2e8f0" }} />
              <button onClick={saveRate} style={{ padding: "10px 18px", borderRadius: 10, border: "none", background: "#3b82f6", color: "#fff", fontWeight: 600, cursor: "pointer" }}>שמור</button>
            </div>
          </div>

          <div style={{ background: "#111a2e", borderRadius: 16, padding: 18, marginBottom: 14, border: "1px solid #1e293b" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 12 }}>🔑 שנה PIN אישי</div>
            <div style={{ display: "flex", gap: 10 }}>
              <input value={userPin} onChange={e => setUserPin(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="4 ספרות" maxLength={4} inputMode="numeric" style={{ flex: 1, padding: 10, borderRadius: 10, border: "1px solid #334155", background: "#0b1220", color: "#e2e8f0", direction: "ltr", textAlign: "center" }} />
              <button onClick={saveUserPin} style={{ padding: "10px 18px", borderRadius: 10, border: "none", background: "#3b82f6", color: "#fff", fontWeight: 600, cursor: "pointer" }}>שמור</button>
            </div>
          </div>

          <div style={{ background: "#111a2e", borderRadius: 16, padding: 18, marginBottom: 14, border: "1px solid #1e293b" }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 12 }}>🔧 שנה PIN מנהל</div>
            <div style={{ display: "flex", gap: 10 }}>
              <input value={adminPinVal} onChange={e => setAdminPinVal(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="4 ספרות" maxLength={4} inputMode="numeric" style={{ flex: 1, padding: 10, borderRadius: 10, border: "1px solid #334155", background: "#0b1220", color: "#e2e8f0", direction: "ltr", textAlign: "center" }} />
              <button onClick={saveAdminPin} style={{ padding: "10px 18px", borderRadius: 10, border: "none", background: "#3b82f6", color: "#fff", fontWeight: 600, cursor: "pointer" }}>שמור</button>
            </div>
            <div style={{ fontSize: 11, color: "#475569", marginTop: 8 }}>PIN ברירת מחדל: 0000</div>
          </div>

          {saved && <div style={{ color: "#4ade80", fontSize: 13, textAlign: "center" }}>{saved}</div>}
        </div>
      );
    }

    // ─── Main app screen ─────────────────────────────────────────────────────────
    function MainApp({ onLogout }) {
      const [active, setActive] = useState(undefined); // undefined = loading, null = no active shift
      const [history, setHistory] = useState({});
      const [hourlyRate, setHourlyRate] = useState(0);
      const [now, setNow] = useState(Date.now());
      const [monthOffset, setMonthOffset] = useState(0);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showAdminPin, setShowAdminPin] = useState(false);
      const [adminPin, setAdminPin] = useState(null);
      const [modalShift, setModalShift] = useState(null); // {key, data} or "new" or null
      const [showManualAdd, setShowManualAdd] = useState(false);

      useEffect(() => {
        const refA = _db.ref(`shifts/${USER}/active`);
        refA.on("value", snap => setActive(snap.exists() ? snap.val() : null), () => setActive(null));
        const refH = _db.ref(`shifts/${USER}/history`);
        refH.on("value", snap => setHistory(snap.exists() ? snap.val() : {}), () => setHistory({}));
        const refR = _db.ref(`shifts/${USER}/hourlyRate`);
        refR.on("value", snap => setHourlyRate(snap.exists() ? snap.val() : 0), () => setHourlyRate(0));
        return () => { refA.off(); refH.off(); refR.off(); };
      }, []);

      useEffect(() => {
        if (!active) return;
        const t = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(t);
      }, [active]);

      useEffect(() => {
        if (showAdminPin && adminPin === null) {
          _db.ref("shifts/_admin/adminPin").once("value", snap => setAdminPin(snap.exists() ? snap.val() : "0000"), () => setAdminPin("0000"));
        }
      }, [showAdminPin, adminPin]);

      const startShift = () => { _db.ref(`shifts/${USER}/active`).set({ start: Date.now() }); };
      const endShift = () => {
        if (!active) return;
        const start = active.start, end = Date.now();
        _db.ref(`shifts/${USER}/history`).push({ start, end, duration: end - start });
        _db.ref(`shifts/${USER}/active`).set(null);
      };

      const deleteShift = key => { _db.ref(`shifts/${USER}/history/${key}`).remove(); };
      const saveEditedShift = (key, data) => { _db.ref(`shifts/${USER}/history/${key}`).set(data); };
      const addManualShift = data => { _db.ref(`shifts/${USER}/history`).push(data); };

      const viewDate = new Date();
      viewDate.setMonth(viewDate.getMonth() + monthOffset);
      const viewYear = viewDate.getFullYear(), viewMonth = viewDate.getMonth();

      const monthEntries = Object.entries(history)
        .filter(([, e]) => { const d = new Date(e.start); return d.getFullYear() === viewYear && d.getMonth() === viewMonth; })
        .sort((a, b) => b[1].start - a[1].start);

      const totalMs = monthEntries.reduce((sum, [, e]) => sum + e.duration, 0);
      const totalHoursDecimal = totalMs / 3600000;
      const totalPay = totalHoursDecimal * (Number(hourlyRate) || 0);

      const elapsed = active ? now - active.start : 0;

      return (
        <div style={{ minHeight: "100vh", background: "#0b1220", fontFamily: "'Segoe UI',Tahoma,sans-serif", color: "#e2e8f0", paddingBottom: 40 }} className="safe-bottom">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 20px 6px" }}>
            <div style={{ fontSize: 18, fontWeight: 700 }}>🕐 מערכת משמרות</div>
            <div style={{ display: "flex", gap: 14 }}>
              <button onClick={() => setShowAdminPin(true)} style={{ background: "transparent", border: "none", color: "#64748b", fontSize: 20, cursor: "pointer" }}>🔧</button>
              <button onClick={onLogout} style={{ background: "transparent", border: "none", color: "#64748b", fontSize: 20, cursor: "pointer" }}>🚪</button>
            </div>
          </div>

          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "30px 20px" }}>
            {active ? (
              <>
                <div style={{ fontSize: 13, color: "#64748b", marginBottom: 6 }}>התחלת משמרת: {fmtTime(active.start)}</div>
                <div style={{ fontSize: 40, fontWeight: 700, letterSpacing: 2, marginBottom: 22, direction: "ltr" }}>{fmtHMS(elapsed)}</div>
                <button onClick={endShift} style={{ width: 180, height: 180, borderRadius: "50%", border: "none", background: "#dc2626", color: "#fff", fontSize: 17, fontWeight: 700, cursor: "pointer", animation: "pulse 2s infinite" }}>
                  ⏹<br/>סיים משמרת
                </button>
              </>
            ) : active === null ? (
              <button onClick={startShift} style={{ width: 180, height: 180, borderRadius: "50%", border: "none", background: "#16a34a", color: "#fff", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>
                ▶<br/>התחל משמרת
              </button>
            ) : (
              <div style={{ color: "#475569", fontSize: 14 }}>טוען...</div>
            )}
          </div>

          <div style={{ padding: "0 20px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <button onClick={() => setMonthOffset(o => o - 1)} style={{ background: "transparent", border: "none", color: "#3b82f6", fontSize: 20, cursor: "pointer" }}>›</button>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{MONTH_NAMES[viewMonth]} {viewYear}</div>
              <button onClick={() => setMonthOffset(o => o + 1)} disabled={monthOffset >= 0} style={{ background: "transparent", border: "none", color: monthOffset >= 0 ? "#334155" : "#3b82f6", fontSize: 20, cursor: monthOffset >= 0 ? "default" : "pointer" }}>‹</button>
            </div>

            <div style={{ background: "#111a2e", borderRadius: 16, padding: 18, border: "1px solid #1e293b", marginBottom: 20, display: "flex", justifyContent: "space-around", textAlign: "center" }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#3b82f6" }}>{totalHoursDecimal.toFixed(1)}</div>
                <div style={{ fontSize: 11, color: "#64748b" }}>שעות</div>
              </div>
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#3b82f6" }}>{monthEntries.length}</div>
                <div style={{ fontSize: 11, color: "#64748b" }}>משמרות</div>
              </div>
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#4ade80" }}>₪{totalPay.toFixed(0)}</div>
                <div style={{ fontSize: 11, color: "#64748b" }}>תשלום</div>
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8" }}>היסטוריה</div>
              <button onClick={() => setShowManualAdd(true)} style={{ background: "transparent", border: "1px solid #334155", borderRadius: 8, padding: "6px 12px", color: "#3b82f6", fontSize: 12, cursor: "pointer" }}>➕ הוספה ידנית</button>
            </div>

            {monthEntries.length === 0 && <div style={{ color: "#475569", fontSize: 13, textAlign: "center", padding: 20 }}>אין משמרות בחודש זה</div>}

            {monthEntries.map(([key, e]) => (
              <div key={key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#111a2e", borderRadius: 12, padding: "12px 14px", marginBottom: 8, border: "1px solid #1e293b" }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{fmtDate(e.start)}</div>
                  <div style={{ fontSize: 12, color: "#64748b", direction: "ltr", textAlign: "right" }}>{fmtTime(e.start)} – {fmtTime(e.end)}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#3b82f6" }}>{fmtHours(e.duration)}</div>
                  <button onClick={() => setModalShift({ key, data: e })} style={{ background: "transparent", border: "none", color: "#64748b", cursor: "pointer", fontSize: 15 }}>✏️</button>
                  <button onClick={() => { if (confirm("למחוק משמרת זו?")) deleteShift(key); }} style={{ background: "transparent", border: "none", color: "#f87171", cursor: "pointer", fontSize: 15 }}>🗑</button>
                </div>
              </div>
            ))}
          </div>

          {showManualAdd && <ShiftModal onSave={data => { addManualShift(data); setShowManualAdd(false); }} onCancel={() => setShowManualAdd(false)} />}
          {modalShift && <ShiftModal initial={modalShift.data} onSave={data => { saveEditedShift(modalShift.key, data); setModalShift(null); }} onCancel={() => setModalShift(null)} />}

          {showAdminPin && !showAdmin && (
            <div style={{ position: "fixed", inset: 0, zIndex: 45 }}>
              <PinPad
                title="🔧 כניסת מנהל"
                correctPin={adminPin}
                accent="#3b82f6"
                onBack={() => setShowAdminPin(false)}
                onSuccess={() => { setShowAdmin(true); setShowAdminPin(false); }}
              />
            </div>
          )}
          {showAdmin && <AdminPanel hourlyRate={hourlyRate} onClose={() => setShowAdmin(false)} />}
        </div>
      );
    }

    // ─── Root: loading → PIN gate → app ──────────────────────────────────────────
    function Root() {
      const [pinOk, setPinOk] = useState(localStorage.getItem("shift_pin_ok") === "1");
      const [userPin, setUserPin] = useState(null);
      const [pinChecked, setPinChecked] = useState(false);

      useEffect(() => {
        _db.ref(`shifts/${USER}/pin`).once("value", snap => {
          setUserPin(snap.exists() ? snap.val() : "1111");
          setPinChecked(true);
        }, err => { console.error(err); setUserPin("1111"); setPinChecked(true); });
      }, []);

      const logout = () => { localStorage.removeItem("shift_pin_ok"); setPinOk(false); };

      if (!pinChecked) return <div style={{ minHeight: "100vh", background: "linear-gradient(160deg,#0b1220 0%,#111e3a 60%,#0b1220 100%)", display: "flex", alignItems: "center", justifyContent: "center", color: "#3b82f6", fontSize: 16 }}>טוען...</div>;
      if (!pinOk) return <PinPad title="🕐 מערכת משמרות" subtitle="מתן" correctPin={userPin} accent="#3b82f6" onSuccess={() => { localStorage.setItem("shift_pin_ok","1"); setPinOk(true); }} />;
      return <MainApp onLogout={logout} />;
    }

    window.__authReady.then(() => {
      ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
    });
  </script>
</body>
</html>
